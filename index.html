<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 3학년 국어 시간! 초성 속담 퀴즈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <h1>💡 국어 시간 5분 초성 퀴즈</h1>
    <div class="hint" id="hint">힌트가 여기에 표시됩니다.</div>
    <div class="initials" id="initials">초성 위치</div>
    
    <input type="text" id="answer-input" placeholder="정답을 입력하세요" onkeydown="if(event.key === 'Enter') checkAnswer()">
    <br>
    <button onclick="checkAnswer()" id="submit-btn">정답 확인</button>
    
    <div class="result" id="result-message"></div>
    <div class="score" id="score-board">문항: 1 / 3</div>
</div>

<script src="script.js"></script>
</body>
</html>
